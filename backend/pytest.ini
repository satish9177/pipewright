[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
cache_dir = C:\Users\Hp\pipewright\.pytest_cache
tmp_path_retention_policy = none
markers =
    unit: tests with no API calls (fast)
    api: tests that call Gemini (slow, rate limited)