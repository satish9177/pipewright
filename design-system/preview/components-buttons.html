<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .btn { font-family: var(--pw-font-sans); font-size: 13px; font-weight: 500; padding: 8px 14px; border-radius: 2px; border: 1px solid transparent; cursor: pointer; line-height: 1; }
  .btn-primary { background: #B7531C; color: #F6F4EE; border-color: #B7531C; }
  .btn-primary:hover { background: #8A3F12; }
  .btn-secondary { background: #fff; color: #0E1116; border-color: #0E1116; }
  .btn-ghost { background: transparent; color: #0E1116; border-color: transparent; }
  .btn-ghost:hover { background: #EDEEF1; }
  .btn-danger { background: #fff; color: #9B2C2C; border-color: #9B2C2C; }
  .btn-danger:hover { background: #FAE8E8; }
  .btn-disabled { background: #EDEEF1; color: #8A929C; border-color: #E4E6EA; cursor: not-allowed; }
  .btn-mono { font-family: var(--pw-font-mono); font-size: 12px; letter-spacing: 0.04em; }
  .group { display: flex; gap: 8px; align-items: center; }
</style>
</head>
<body style="padding: 28px;">
  <div class="group" style="margin-bottom: 10px;">
    <button class="btn btn-primary">Approve and merge</button>
    <button class="btn btn-secondary">Inspect diff</button>
    <button class="btn btn-danger">Reject</button>
    <button class="btn btn-ghost">Cancel</button>
    <button class="btn btn-disabled" disabled>Approve</button>
  </div>
  <div class="group" style="margin-bottom: 10px;">
    <button class="btn btn-primary btn-mono">[APPROVE]</button>
    <button class="btn btn-secondary btn-mono">[INSPECT]</button>
    <button class="btn btn-danger btn-mono">[REJECT]</button>
    <button class="btn btn-ghost btn-mono">[CANCEL]</button>
  </div>
  <div style="margin-top:14px; font-family: var(--pw-font-sans); font-size: 13px; color: var(--pw-fg-muted); line-height:1.45;">
    Two label styles. <strong style="color:var(--pw-fg);">Sentence-case for user-flow buttons</strong>, mono <code style="font-family:var(--pw-font-mono); background:#EDEEF1; padding:1px 4px; font-size:11px;">[BRACKETED]</code> for power-user / dev tool actions. Pick one per surface, don't mix.
  </div>
</body></html>
