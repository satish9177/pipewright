<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body style="padding: 28px;">
  <div style="display:flex; gap: 22px; align-items: center; flex-wrap: wrap;">
    <i data-lucide="git-branch"          style="width:22px; height:22px; color: var(--pw-ink-900);"></i>
    <i data-lucide="git-commit-horizontal" style="width:22px; height:22px; color: var(--pw-ink-900);"></i>
    <i data-lucide="git-pull-request"    style="width:22px; height:22px; color: var(--pw-ink-900);"></i>
    <i data-lucide="check"               style="width:22px; height:22px; color: var(--pw-pass-600);"></i>
    <i data-lucide="x"                   style="width:22px; height:22px; color: var(--pw-fail-600);"></i>
    <i data-lucide="clock"               style="width:22px; height:22px; color: var(--pw-wait-600);"></i>
    <i data-lucide="play"                style="width:22px; height:22px; color: var(--pw-ink-900);"></i>
    <i data-lucide="pause"               style="width:22px; height:22px; color: var(--pw-ink-900);"></i>
    <i data-lucide="file-diff"           style="width:22px; height:22px; color: var(--pw-ink-900);"></i>
    <i data-lucide="database"            style="width:22px; height:22px; color: var(--pw-ink-900);"></i>
    <i data-lucide="terminal"            style="width:22px; height:22px; color: var(--pw-ink-900);"></i>
    <i data-lucide="shield-check"        style="width:22px; height:22px; color: var(--pw-copper-600);"></i>
  </div>
  <div style="margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--pw-border); font-family: var(--pw-font-sans); font-size: 13px; color: var(--pw-fg-muted); line-height: 1.5;">
    <strong style="color:var(--pw-fg);">Lucide</strong> at 1.5px stroke. Used only where a text label won't do. Default to ink-900; status colors only when icon is the status indicator (no label nearby).
  </div>
  <div style="margin-top: 6px; font-family: var(--pw-font-mono); font-size: 10px; color: var(--pw-fg-subtle); letter-spacing: 0.06em;">
    SUBSTITUTION FLAGGED — NO ICON SET EXISTS IN SOURCE REPO
  </div>
  <script>lucide.createIcons();</script>
</body></html>
