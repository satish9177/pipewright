<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding: 28px;">
  <div style="display:grid; grid-template-columns: repeat(8, 1fr); gap: 6px;">
    <div><div style="height:64px; background:#F4F5F7; border:1px solid rgba(14,17,22,0.06); border-radius:2px;"></div><div style="margin-top:6px; font-family:var(--pw-font-mono); font-size:10px;">50</div></div>
    <div><div style="height:64px; background:#EDEEF1; border-radius:2px;"></div><div style="margin-top:6px; font-family:var(--pw-font-mono); font-size:10px;">100</div></div>
    <div><div style="height:64px; background:#E4E6EA; border-radius:2px;"></div><div style="margin-top:6px; font-family:var(--pw-font-mono); font-size:10px;">150</div></div>
    <div><div style="height:64px; background:#D6D9DE; border-radius:2px;"></div><div style="margin-top:6px; font-family:var(--pw-font-mono); font-size:10px;">200</div></div>
    <div><div style="height:64px; background:#B5BAC2; border-radius:2px;"></div><div style="margin-top:6px; font-family:var(--pw-font-mono); font-size:10px;">300</div></div>
    <div><div style="height:64px; background:#8A929C; border-radius:2px;"></div><div style="margin-top:6px; font-family:var(--pw-font-mono); font-size:10px; color:#fff; background:#8A929C; padding:1px 3px; display:inline-block;">400</div></div>
    <div><div style="height:64px; background:#6B7480; border-radius:2px;"></div><div style="margin-top:6px; font-family:var(--pw-font-mono); font-size:10px;">500</div></div>
    <div><div style="height:64px; background:#3D4550; border-radius:2px;"></div><div style="margin-top:6px; font-family:var(--pw-font-mono); font-size:10px;">600</div></div>
  </div>
  <div style="margin-top:14px; font-family: var(--pw-font-sans); font-size: 13px; color: var(--pw-fg-muted); line-height:1.45;">
    Steel — cool gray neutrals for borders, dividers, muted text, and disabled states. Reach for 200 first.
  </div>
</body></html>
