<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .stages { display:flex; align-items:center; gap: 0; font-family: var(--pw-font-mono); font-size: 11px; letter-spacing: 0.06em; }
  .stage { display:flex; align-items:center; gap:8px; padding: 8px 12px; border:1px solid var(--pw-border); background:#fff; border-radius:2px; }
  .stage .dot { width:8px; height:8px; border-radius:50%; background:#B5BAC2; }
  .stage.done { border-color: var(--pw-pass-600); }
  .stage.done .dot { background: var(--pw-pass-600); }
  .stage.active { border-color: var(--pw-ink-900); background: var(--pw-ink-900); color: var(--pw-paper); }
  .stage.active .dot { background: var(--pw-copper-500); animation: pulse 1.2s ease-in-out infinite; }
  .stage.todo { color: var(--pw-fg-subtle); border-style: dashed; }
  .conn { flex: 0 0 16px; height: 1px; background: var(--pw-border); }
  .conn.done { background: var(--pw-pass-600); }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.4 } }
</style>
</head>
<body style="padding: 28px;">
  <div class="stages">
    <div class="stage done"><span class="dot"></span>PLAN</div>
    <div class="conn done"></div>
    <div class="stage done"><span class="dot"></span>CODE</div>
    <div class="conn done"></div>
    <div class="stage active"><span class="dot"></span>PATCH</div>
    <div class="conn"></div>
    <div class="stage todo"><span class="dot"></span>TEST</div>
    <div class="conn"></div>
    <div class="stage todo"><span class="dot"></span>APPROVAL</div>
  </div>
  <div style="margin-top:18px; font-family: var(--pw-font-sans); font-size: 13px; color: var(--pw-fg-muted); line-height:1.45;">
    The five canonical pipeline stages. Done = pass-600 outline. Active = ink-fill with copper pulse. Todo = dashed steel border, muted text.
  </div>
</body></html>
