<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .row { display:flex; gap: 10px; align-items: center; }
  .risk { display:inline-flex; align-items:center; gap:6px; padding:3px 9px; border-radius:999px; font-family: var(--pw-font-mono); font-size:10px; letter-spacing:0.08em; }
  .risk .dot { width:6px; height:6px; border-radius:50%; }
  .risk.low  { background: #D5E8DC; color: #14502C; } .risk.low .dot  { background: #1F6E3D; }
  .risk.med  { background: #EBE0BC; color: #6B5410; } .risk.med .dot  { background: #8A6D1A; }
  .risk.high { background: #F1D4D4; color: #7A1F1F; } .risk.high .dot { background: #9B2C2C; }
  .bar { width: 80px; height: 6px; background: var(--pw-steel-150); position: relative; border-radius: 2px; overflow: hidden; }
  .bar > i { position:absolute; top:0; left:0; height:100%; }
  .bar.low  > i { width: 33%; background: #1F6E3D; }
  .bar.med  > i { width: 66%; background: #8A6D1A; }
  .bar.high > i { width: 100%; background: #9B2C2C; }
</style>
</head>
<body style="padding: 28px;">
  <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 18px;">
    <div>
      <div class="row" style="margin-bottom:8px;"><span class="risk low"><span class="dot"></span>RISK · LOW</span></div>
      <div class="bar low"><i></i></div>
      <div style="margin-top:10px; font-family: var(--pw-font-sans); font-size:13px; color: var(--pw-fg-muted);">Pure formatting, no behavioral change. Auto-approve is safe in this band.</div>
    </div>
    <div>
      <div class="row" style="margin-bottom:8px;"><span class="risk med"><span class="dot"></span>RISK · MEDIUM</span></div>
      <div class="bar med"><i></i></div>
      <div style="margin-top:10px; font-family: var(--pw-font-sans); font-size:13px; color: var(--pw-fg-muted);">Default. Touches behavior but tests pass. Always requires human review.</div>
    </div>
    <div>
      <div class="row" style="margin-bottom:8px;"><span class="risk high"><span class="dot"></span>RISK · HIGH</span></div>
      <div class="bar high"><i></i></div>
      <div style="margin-top:10px; font-family: var(--pw-font-sans); font-size:13px; color: var(--pw-fg-muted);">Touches checkpoint, approval, or DB schema. Requires reason on approve.</div>
    </div>
  </div>
</body></html>
