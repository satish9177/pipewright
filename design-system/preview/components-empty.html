<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding: 28px;">
  <div style="border: 1px dashed var(--pw-steel-300); border-radius: 4px; padding: 28px; text-align: left;">
    <div style="font-family: var(--pw-font-mono); font-size: 10px; letter-spacing: 0.08em; color: var(--pw-fg-subtle);">[EMPTY]</div>
    <div style="margin-top: 6px; font-family: var(--pw-font-sans); font-size: 16px; font-weight: 600; color: var(--pw-ink-900);">No pending gates</div>
    <div style="margin-top: 4px; font-family: var(--pw-font-sans); font-size: 13px; color: var(--pw-fg-muted); line-height: 1.5; max-width: 480px;">
      All runs are either complete or in-progress. Start a new one with
      <code style="font-family: var(--pw-font-mono); font-size: 12px; background:#EDEEF1; padding: 1px 5px; border-radius:2px;">POST /run</code>
      or via the launch button above.
    </div>
  </div>
  <div style="margin-top:14px; font-family: var(--pw-font-mono); font-size: 11px; color: var(--pw-fg-subtle); letter-spacing: 0.04em;">

  </div>
