<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding: 28px;">
  <div style="display:grid; grid-template-columns: repeat(6, 1fr); gap: 8px;">
    <div><div style="height:60px; background:#FAEFE5; border-radius:2px;"></div><div style="margin-top:6px; font-family:var(--pw-font-mono); font-size:10px;">copper-50</div><div style="font-family:var(--pw-font-mono); font-size:10px; color:var(--pw-fg-subtle);">#FAEFE5</div></div>
    <div><div style="height:60px; background:#F1DDCC; border-radius:2px;"></div><div style="margin-top:6px; font-family:var(--pw-font-mono); font-size:10px;">copper-100</div><div style="font-family:var(--pw-font-mono); font-size:10px; color:var(--pw-fg-subtle);">#F1DDCC</div></div>
    <div><div style="height:60px; background:#D88B5F; border-radius:2px;"></div><div style="margin-top:6px; font-family:var(--pw-font-mono); font-size:10px;">copper-400</div><div style="font-family:var(--pw-font-mono); font-size:10px; color:var(--pw-fg-subtle);">#D88B5F</div></div>
    <div><div style="height:60px; background:#C76A36; border-radius:2px;"></div><div style="margin-top:6px; font-family:var(--pw-font-mono); font-size:10px;">copper-500</div><div style="font-family:var(--pw-font-mono); font-size:10px; color:var(--pw-fg-subtle);">#C76A36</div></div>
    <div><div style="height:60px; background:#B7531C; border-radius:2px;"></div><div style="margin-top:6px; font-family:var(--pw-font-mono); font-size:10px; color:#B7531C;">copper-600 ★</div><div style="font-family:var(--pw-font-mono); font-size:10px; color:var(--pw-fg-subtle);">#B7531C</div></div>
    <div><div style="height:60px; background:#8A3F12; border-radius:2px;"></div><div style="margin-top:6px; font-family:var(--pw-font-mono); font-size:10px;">copper-700</div><div style="font-family:var(--pw-font-mono); font-size:10px; color:var(--pw-fg-subtle);">#8A3F12</div></div>
  </div>
  <div style="margin-top:14px; font-family: var(--pw-font-sans); font-size: 13px; color: var(--pw-fg-muted); line-height:1.45;">
    Solder copper — the single warm accent. <strong style="color:var(--pw-fg);">600 is the primary</strong>. Used sparingly: primary button, the brand junction dot, active state markers. Never on body text.
  </div>
</body></html>
