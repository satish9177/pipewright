<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding: 28px;">
  <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px;">
    <div>
      <div style="height:64px; background:#fff; border:1px solid #D6D9DE; border-radius:4px;"></div>
      <div style="margin-top:8px; font-family:var(--pw-font-mono); font-size:10px;">hairline</div>
      <div style="font-family:var(--pw-font-mono); font-size:10px; color:var(--pw-fg-subtle);">1px steel-200</div>
    </div>
    <div>
      <div style="height:64px; background:#fff; border:1px solid #0E1116; border-radius:4px;"></div>
      <div style="margin-top:8px; font-family:var(--pw-font-mono); font-size:10px;">strong</div>
      <div style="font-family:var(--pw-font-mono); font-size:10px; color:var(--pw-fg-subtle);">1px ink-900 · focused / active</div>
    </div>
    <div>
      <div style="height:64px; background:#fff; border:1px dashed #B5BAC2; border-radius:4px;"></div>
      <div style="margin-top:8px; font-family:var(--pw-font-mono); font-size:10px;">dashed</div>
      <div style="font-family:var(--pw-font-mono); font-size:10px; color:var(--pw-fg-subtle);">1px dashed steel-300 · empty states</div>
    </div>
  </div>
  <div style="margin-top:16px; font-family: var(--pw-font-sans); font-size: 13px; color: var(--pw-fg-muted); line-height:1.45;">
    Lift comes from <strong style="color:var(--pw-fg);">hairline + tone shift</strong>, never drop shadow. One reluctant exception: popovers get a barely-there shadow.
  </div>
</body></html>
