<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding: 28px;">
  <div style="display:grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 10px;">
    <div>
      <div style="height:88px; background:#F6F4EE; border:1px solid rgba(14,17,22,0.08); border-radius:2px;"></div>
      <div style="margin-top:8px; font-family:var(--pw-font-mono); font-size:11px; color:var(--pw-fg);">paper</div>
      <div style="font-family:var(--pw-font-mono); font-size:10px; color:var(--pw-fg-subtle);">#F6F4EE</div>
    </div>
    <div>
      <div style="height:88px; background:#EFEBE0; border:1px solid rgba(14,17,22,0.08); border-radius:2px;"></div>
      <div style="margin-top:8px; font-family:var(--pw-font-mono); font-size:11px; color:var(--pw-fg);">paper-2</div>
      <div style="font-family:var(--pw-font-mono); font-size:10px; color:var(--pw-fg-subtle);">#EFEBE0</div>
    </div>
    <div>
      <div style="height:88px; background:#0E1116; border-radius:2px;"></div>
      <div style="margin-top:8px; font-family:var(--pw-font-mono); font-size:11px; color:var(--pw-fg);">ink-900</div>
      <div style="font-family:var(--pw-font-mono); font-size:10px; color:var(--pw-fg-subtle);">#0E1116</div>
    </div>
    <div>
      <div style="height:88px; background:#B7531C; border-radius:2px;"></div>
      <div style="margin-top:8px; font-family:var(--pw-font-mono); font-size:11px; color:var(--pw-fg);">copper-600</div>
      <div style="font-family:var(--pw-font-mono); font-size:10px; color:var(--pw-fg-subtle);">#B7531C</div>
    </div>
  </div>
  <div style="margin-top:14px; font-family: var(--pw-font-sans); font-size: 13px; color: var(--pw-fg-muted); line-height:1.45;">
    Two surfaces (warm paper, near-black ink) plus one warm accent. The whole palette is built off these four.
  </div>
</body></html>
