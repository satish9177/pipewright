<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding: 28px;">
  <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap: 10px;">

    <div>
      <div style="display:flex; gap:0; height:56px; border-radius:2px; overflow:hidden;">
        <div style="flex:1; background:#EAF3EE;"></div>
        <div style="flex:1; background:#D5E8DC;"></div>
        <div style="flex:1; background:#1F6E3D;"></div>
        <div style="flex:1; background:#14502C;"></div>
      </div>
      <div style="margin-top:6px;"><span style="display:inline-block; padding:2px 8px; background:#D5E8DC; color:#14502C; font-family:var(--pw-font-mono); font-size:10px; letter-spacing:0.08em; border-radius:999px;">PASS</span></div>
      <div style="margin-top:4px; font-family:var(--pw-font-mono); font-size:10px; color:var(--pw-fg-subtle);">approved · tests passed</div>
    </div>

    <div>
      <div style="display:flex; gap:0; height:56px; border-radius:2px; overflow:hidden;">
        <div style="flex:1; background:#F5EFD7;"></div>
        <div style="flex:1; background:#EBE0BC;"></div>
        <div style="flex:1; background:#8A6D1A;"></div>
        <div style="flex:1; background:#6B5410;"></div>
      </div>
      <div style="margin-top:6px;"><span style="display:inline-block; padding:2px 8px; background:#EBE0BC; color:#6B5410; font-family:var(--pw-font-mono); font-size:10px; letter-spacing:0.08em; border-radius:999px;">PENDING</span></div>
      <div style="margin-top:4px; font-family:var(--pw-font-mono); font-size:10px; color:var(--pw-fg-subtle);">running · waiting</div>
    </div>

    <div>
      <div style="display:flex; gap:0; height:56px; border-radius:2px; overflow:hidden;">
        <div style="flex:1; background:#FAE8E8;"></div>
        <div style="flex:1; background:#F1D4D4;"></div>
        <div style="flex:1; background:#9B2C2C;"></div>
        <div style="flex:1; background:#7A1F1F;"></div>
      </div>
      <div style="margin-top:6px;"><span style="display:inline-block; padding:2px 8px; background:#F1D4D4; color:#7A1F1F; font-family:var(--pw-font-mono); font-size:10px; letter-spacing:0.08em; border-radius:999px;">FAIL</span></div>
      <div style="margin-top:4px; font-family:var(--pw-font-mono); font-size:10px; color:var(--pw-fg-subtle);">rejected · failed</div>
    </div>

    <div>
      <div style="display:flex; gap:0; height:56px; border-radius:2px; overflow:hidden;">
        <div style="flex:1; background:#EAF0F7;"></div>
        <div style="flex:1; background:#D5DFEF;"></div>
        <div style="flex:1; background:#1F4A8A;"></div>
        <div style="flex:1; background:#163A6F;"></div>
      </div>
      <div style="margin-top:6px;"><span style="display:inline-block; padding:2px 8px; background:#D5DFEF; color:#163A6F; font-family:var(--pw-font-mono); font-size:10px; letter-spacing:0.08em; border-radius:999px;">INFO</span></div>
      <div style="margin-top:4px; font-family:var(--pw-font-mono); font-size:10px; color:var(--pw-fg-subtle);">module · timeout</div>
    </div>

  </div>
  <div style="margin-top:14px; font-family: var(--pw-font-sans); font-size: 13px; color: var(--pw-fg-muted); line-height:1.45;">
    Status colors — earthy and muted, not neon. Each has 50, 100, 600, 700 stops.
  </div>
</body></html>
