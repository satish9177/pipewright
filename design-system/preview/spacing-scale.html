<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding: 28px;">
  <div style="display:flex; gap:14px; align-items:flex-end;">
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;"><div style="width:4px; height:4px; background:#0E1116;"></div><div style="font-family:var(--pw-font-mono); font-size:10px;">1<br><span style="color:var(--pw-fg-subtle);">4px</span></div></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;"><div style="width:8px; height:8px; background:#0E1116;"></div><div style="font-family:var(--pw-font-mono); font-size:10px;">2<br><span style="color:var(--pw-fg-subtle);">8</span></div></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;"><div style="width:12px; height:12px; background:#0E1116;"></div><div style="font-family:var(--pw-font-mono); font-size:10px;">3<br><span style="color:var(--pw-fg-subtle);">12</span></div></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;"><div style="width:16px; height:16px; background:#0E1116;"></div><div style="font-family:var(--pw-font-mono); font-size:10px;">4<br><span style="color:var(--pw-fg-subtle);">16</span></div></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;"><div style="width:20px; height:20px; background:#0E1116;"></div><div style="font-family:var(--pw-font-mono); font-size:10px;">5<br><span style="color:var(--pw-fg-subtle);">20</span></div></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;"><div style="width:24px; height:24px; background:#0E1116;"></div><div style="font-family:var(--pw-font-mono); font-size:10px;">6<br><span style="color:var(--pw-fg-subtle);">24</span></div></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;"><div style="width:32px; height:32px; background:#0E1116;"></div><div style="font-family:var(--pw-font-mono); font-size:10px;">8<br><span style="color:var(--pw-fg-subtle);">32</span></div></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;"><div style="width:40px; height:40px; background:#0E1116;"></div><div style="font-family:var(--pw-font-mono); font-size:10px;">10<br><span style="color:var(--pw-fg-subtle);">40</span></div></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;"><div style="width:48px; height:48px; background:#0E1116;"></div><div style="font-family:var(--pw-font-mono); font-size:10px;">12<br><span style="color:var(--pw-fg-subtle);">48</span></div></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;"><div style="width:64px; height:64px; background:#0E1116;"></div><div style="font-family:var(--pw-font-mono); font-size:10px;">16<br><span style="color:var(--pw-fg-subtle);">64</span></div></div>
  </div>
  <div style="margin-top:18px; font-family: var(--pw-font-sans); font-size: 13px; color: var(--pw-fg-muted); line-height:1.45;">
    4px base grid. Dense by default — 36–40px row heights, 24px section gaps. Reach for the smaller end of the scale before the larger.
  </div>
</body></html>
