<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .gate { background: #fff; border: 1px solid var(--pw-border); border-radius: 4px; padding: 18px 22px; }
  .eyebrow { font-family: var(--pw-font-mono); font-size: 10px; color: var(--pw-info-600); letter-spacing: 0.1em; }
  .title { font-family: var(--pw-font-sans); font-size: 18px; font-weight: 600; margin-top: 4px; }
  .meta { font-family: var(--pw-font-mono); font-size: 11px; color: var(--pw-fg-subtle); margin-top: 4px; }
  .rule { border-top: 1px solid var(--pw-border); margin: 14px 0; }
  .grid { display:grid; grid-template-columns: repeat(4, 1fr); gap: 0; font-family: var(--pw-font-mono); font-size: 11px; }
  .grid > div { padding: 0 0; }
  .grid .k { color: var(--pw-fg-subtle); letter-spacing: 0.06em; text-transform: uppercase; }
  .grid .v { font-size: 14px; color: var(--pw-ink-900); margin-top: 2px; }
  .actions { display: flex; gap: 8px; margin-top: 14px; }
  .btn { font-family: var(--pw-font-sans); font-size: 13px; padding: 7px 13px; border-radius: 2px; border: 1px solid; line-height: 1; cursor: pointer; }
  .primary { background: #B7531C; border-color: #B7531C; color: #F6F4EE; }
  .danger { background: #fff; border-color: #9B2C2C; color: #9B2C2C; }
  .ghost { background: transparent; border-color: transparent; color: var(--pw-fg-muted); }
  .risk { display:inline-flex; align-items:center; gap:6px; padding:2px 8px; border-radius:999px; font-family: var(--pw-font-mono); font-size:10px; letter-spacing:0.08em; background:#EBE0BC; color:#6B5410; }
</style>
</head>
<body style="padding: 28px;">
  <div class="gate">
    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
      <div>
        <div class="eyebrow">[APPROVAL] PIPELINE PAUSED · HUMAN DECISION NEEDED</div>
        <div class="title">Add retry logic to the planner when Gemini rate-limits us</div>
        <div class="meta">gate_id ba8c4179 · run_id 8c3f1a92 · paused 2m ago</div>
      </div>
      <span class="risk">RISK · MEDIUM</span>
    </div>
    <div class="rule"></div>
    <div class="grid">
      <div><div class="k">TESTS</div><div class="v">14 / 14</div></div>
      <div><div class="k">DURATION</div><div class="v">12.4s</div></div>
      <div><div class="k">FILES</div><div class="v">2 changed</div></div>
      <div><div class="k">ROLLBACK</div><div class="v">available</div></div>
    </div>
    <div class="actions">
      <button class="btn primary">Approve and merge</button>
      <button class="btn danger">Reject</button>
      <button class="btn ghost">Inspect diff →</button>
    </div>
  </div>
</body></html>
