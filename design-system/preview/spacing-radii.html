<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding: 28px;">
  <div style="display:flex; gap:20px; align-items:flex-end;">
    <div style="text-align:center;">
      <div style="width:80px; height:60px; background:var(--pw-bg-elev); border:1px solid var(--pw-border); border-radius:0;"></div>
      <div style="margin-top:8px; font-family:var(--pw-font-mono); font-size:10px;">0</div>
      <div style="font-family:var(--pw-font-mono); font-size:10px; color:var(--pw-fg-subtle);">table cell</div>
    </div>
    <div style="text-align:center;">
      <div style="width:80px; height:60px; background:var(--pw-bg-elev); border:1px solid var(--pw-border); border-radius:2px;"></div>
      <div style="margin-top:8px; font-family:var(--pw-font-mono); font-size:10px;">2px</div>
      <div style="font-family:var(--pw-font-mono); font-size:10px; color:var(--pw-fg-subtle);">button · input</div>
    </div>
    <div style="text-align:center;">
      <div style="width:80px; height:60px; background:var(--pw-bg-elev); border:1px solid var(--pw-border); border-radius:4px;"></div>
      <div style="margin-top:8px; font-family:var(--pw-font-mono); font-size:10px;">4px</div>
      <div style="font-family:var(--pw-font-mono); font-size:10px; color:var(--pw-fg-subtle);">card · modal</div>
    </div>
    <div style="text-align:center;">
      <div style="width:80px; height:32px; background:#D5E8DC; border:1px solid rgba(14,17,22,0.08); border-radius:999px; display:flex; align-items:center; justify-content:center; font-family:var(--pw-font-mono); font-size:10px; color:#14502C; letter-spacing:0.08em;">PASS</div>
      <div style="margin-top:8px; font-family:var(--pw-font-mono); font-size:10px;">pill</div>
      <div style="font-family:var(--pw-font-mono); font-size:10px; color:var(--pw-fg-subtle);">status tags only</div>
    </div>
  </div>
  <div style="margin-top:18px; font-family: var(--pw-font-sans); font-size: 13px; color: var(--pw-fg-muted); line-height:1.45;">
    Engineering, not consumer. Square or near-square everything. Pills are reserved for status tags — nowhere else.
  </div>
</body></html>
