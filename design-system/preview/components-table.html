<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--pw-border); font-size: 13px; }
  th { font-family: var(--pw-font-sans); font-weight: 500; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--pw-fg-subtle); background: var(--pw-paper-2); border-bottom: 1px solid var(--pw-border); }
  td.mono { font-family: var(--pw-font-mono); font-size: 11.5px; }
  .pill { font-family: var(--pw-font-mono); font-size: 10px; letter-spacing: 0.08em; padding: 2px 8px; border-radius: 999px; }
  .pass { background: #D5E8DC; color: #14502C; }
  .wait { background: #EBE0BC; color: #6B5410; }
  .fail { background: #F1D4D4; color: #7A1F1F; }
  tr:hover td { background: var(--pw-steel-50); }
</style>
</head>

  </table>
</body></html>
