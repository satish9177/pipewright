<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pipewright Console — Print</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../colors_and_type.css">
  <style>
    html, body { margin: 0; background: var(--pw-bg); }
    button { font-family: inherit; }
    /* Animations are no-ops in print; keep keyframes for screen preview */
    @keyframes pwPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

    /* Each Console screen renders at a fixed 1280×800. */
    .print-page {
      width: 1280px;
      height: 800px;
      overflow: hidden;
      background: var(--pw-bg);
      page-break-after: always;
      break-after: page;
      /* keep a thin separator between pages in screen preview */
      box-shadow: 0 1px 0 var(--pw-border);
    }
    .print-page:last-child { page-break-after: auto; break-after: auto; }

    /* Make AppShell fit exactly the page height */
    .print-page > div { height: 800px !important; }

    @page {
      size: 1280px 800px;
      margin: 0;
    }

    @media print {
      html, body {
        background: var(--pw-bg);
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .print-page {
        box-shadow: none;
        margin: 0;
      }
      /* Disable hover/active transitions for cleaner print */
      * { transition: none !important; animation: none !important; }
      /* Hide scrollbars in print */
      ::-webkit-scrollbar { display: none; }
    }
  </style>
</head>
<body data-screen-label="Pipewright Console — Print">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"
          integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
          crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
          integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
          crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
          integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
          crossorigin="anonymous"></script>

  <script src="data.js"></script>
  <script type="text/babel" src="components.jsx"></script>

  <script type="text/babel" src="Memory.jsx"></script>
  <script type="text/babel" src="StartRun.jsx"></script>
  <script type="text/babel" src="print-app.jsx"></script>
</body>
</html>
